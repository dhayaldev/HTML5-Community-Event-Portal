<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Banner</title>
    <style>
        #welcomeBanner 
        {
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }
        .highlight 
        {
            background-color: yellow;
            font-weight: bold;
            padding: 3px;
        }
    </style>
</head>
<body>
    <div id="welcomeBanner">
        <h1>Welcome to the Local Community Event Portal</h1>
        <p>
            Hello Resident! Check out our
            <span style="color:red; font-weight:bold;">
                Special Community Offer
            </span>
        </p>
    </div>
    <br>
    <p class="highlight">
        Registration for upcoming events is now open.
    </p>
    <p>
        Join our
        <span class="highlight">
            Community Awareness Program
        </span>
        this weekend.
    </p>
</body>
</html>
