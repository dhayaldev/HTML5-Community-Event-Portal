<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Event Gallery</title>
    <style>
    body
    {
        font-family: Arial, sans-serif;
        text-align: center;
    }
    table
    {
        margin: auto;
        border-collapse: collapse;
    }
    td
    {
        padding: 15px;
    }
    .event-image
    {
        width: 220px;
        height: 160px;
        object-fit: cover;
        border: 3px solid black;
        border-radius: 8px;
    }
    caption
    {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 15px;
    }
</style>
</head>
<body>
    <table>
        <caption>Community Event Gallery</caption>
        <tr>
            <td>
                <img src="images/event1.jpg" alt="Cultural Event" title="Cultural Festival" class="event-image">
                <p>Cultural Festival</p>
            </td>
            <td>
                <img src="images/event2.jpg" alt="Sports Event" title="Sports Meet" class="event-image">
                <p>Sports Meet</p>
            </td>
            <td>
                <img src="images/event3.jpg" alt="Music Event" title="Music Concert" class="event-image">
                <p>Music Concert</p>
            </td>
        </tr>
        <tr>
            <td>
                <img src="images/event4.jpg" alt="Awareness Program" title="Awareness Program" class="event-image">
                <p>Awareness Program</p>
            </td>
            <td>
                <img src="images/event5.jpg" alt="Workshop" title="Skill Development Workshop" class="event-image">
                <p>Skill Workshop</p>
            </td>
            <td>
                <img src="images/event6.jpg" alt="Community Service" title="Community Service" class="event-image">
                <p>Community Service</p>
            </td>
        </tr>
    </table>
</body>
</html>
