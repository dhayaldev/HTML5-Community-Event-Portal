<!DOCTYPE html>
<html>
<head>
    <title>Geolocation Demo</title>
    <style>
        body
        {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        button
        {
            padding: 10px 20px;
            font-size: 16px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover
        {
            background-color: darkblue;
        }
        #location
        {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>
    <h1>Find My Location</h1>
    <button onclick="getLocation()">
        Get Current Location
    </button>
    <p id="location"></p>
    <script>
        function getLocation()
        {
            if(navigator.geolocation)
            {
                navigator.geolocation.getCurrentPosition(showPosition,showError);
            }
            else
            {
                document.getElementById("location").innerHTML = "Geolocation is not supported by this browser.";
            }
        }
        function showPosition(position)
        {
            document.getElementById("location").innerHTML = "Latitude: " + position.coords.latitude + "<br>Longitude: " + position.coords.longitude;
        }
        function showError(error)
        {
            document.getElementById("location").innerHTML = "Location access denied.";
        }
    </script>
</body>
</html>
