<!DOCTYPE html>
<html>
<head>
    <title>Community Event Registration</title>
    <style>
        body
        {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 30px;
        }
        form
        {
            width: 400px;
            margin: auto;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        input,select,textarea
        {
            width: 90%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .gender-section
        {
            width: 90%;
            margin: auto;
            text-align: left;
        }
        .gender-section input
        {
            width: auto;
        }
        .checkbox-container
        {
            width: 90%;
            margin: auto;
            text-align: left;
        }
        .checkbox-container input
        {
            width: auto;
        }
        button
        {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover
        {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <h1>Community Event Registration</h1>
    <form>
        <label>Full Name</label><br>
        <input type="text" placeholder="Enter your name" required>
        <label>Email</label><br>
        <input type="email" placeholder="Enter your email" required>
        <label>Phone Number</label><br>
        <input type="tel" placeholder="Enter your phone number" required>
        <label>Age</label><br>
        <input type="number" min="1" max="100">
        <div class="gender-section">
            <label>Gender</label><br><br>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> Other
        </div>
        <br>
        <label>Select Event</label><br>
        <select>
            <option>Cultural Festival</option>
            <option>Sports Meet</option>
            <option>Music Concert</option>
            <option>Skill Workshop</option>
            <option>Community Service</option>
        </select>
        <label>Address</label><br>
        <textarea rows="4" placeholder="Enter your address"></textarea>
        <div class="checkbox-container">
            <input type="checkbox" id="agree">
            <label for="agree">
                I agree to the terms and conditions
            </label>
        </div>
        <br>
        <button type="submit">
            Register
        </button>
    </form>
</body>
</html>
